<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descifrando Romanos 8:15</title>

<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f7e4b5,#d8b26e);
margin:0;
padding:20px;
text-align:center;
}

.caja{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
color:#7a4d00;
}

#timer{
font-size:32px;
font-weight:bold;
color:#b22222;
margin-bottom:20px;
}

#estado{
font-size:20px;
margin-bottom:15px;
color:#444;
}

#pregunta{
font-size:28px;
margin:25px 0;
min-height:80px;
}

#opciones{
display:none;
}

.opcion{
display:block;
width:100%;
margin:10px 0;
padding:15px;
font-size:20px;
border:none;
border-radius:10px;
background:#f0b429;
cursor:pointer;
transition:.3s;
}

.opcion:hover{
background:#d89216;
transform:scale(1.02);
}

#btnInicio{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:10px;
background:#28a745;
color:white;
cursor:pointer;
}

#btnInicio:hover{
background:#1e7e34;
}

#puntaje{
font-size:24px;
margin-top:20px;
color:#7a4d00;
font-weight:bold;
}

#resultado{
font-size:22px;
min-height:40px;
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="caja">

<h1>📜 Descifrando Romanos 8:15</h1>

<div id="timer">05:00</div>

<div id="estado">
Tienes 5 minutos para completar el desafío.
</div>

<div id="pregunta">
Presiona COMENZAR para iniciar.
</div>

<button id="btnInicio">
🚀 Comenzar
</button>

<div id="opciones">

<button class="opcion" id="o1"></button>
<button class="opcion" id="o2"></button>
<button class="opcion" id="o3"></button>
<button class="opcion" id="o4"></button>

</div>

<div id="resultado"></div>

<div id="puntaje">
🏆 Puntos: 0
</div>

</div>

<script>

const preguntas = [

{
texto:"Pues no habéis recibido el espíritu de ________",
correcta:"esclavitud",
opciones:["amor","esclavitud","gozo","gracia"]
},

{
texto:"Habéis recibido el espíritu de ________",
correcta:"adopción",
opciones:["temor","juicio","adopción","castigo"]
},

{
texto:"Por el cual clamamos: ¡Abba, ________!",
correcta:"Padre",
opciones:["David","Juan","Padre","Pedro"]
},

{
texto:"Otra vez en ________",
correcta:"temor",
opciones:["alegría","temor","victoria","gozo"]
},

{
texto:"Por el cual ________",
correcta:"clamamos",
opciones:["cantamos","jugamos","clamamos","corremos"]
},

{
texto:"Espíritu de ________",
correcta:"adopción",
opciones:["adopción","culpa","enojo","tristeza"]
}

];

let actual = 0;
let puntos = 0;
let terminado = false;

document.getElementById("btnInicio")
.addEventListener("click", iniciar);

function iniciar(){

document.getElementById("btnInicio").style.display="none";
document.getElementById("opciones").style.display="block";

mostrarPregunta();
iniciarTemporizador();

}

function mostrarPregunta(){

if(actual >= preguntas.length){

finalizar();
return;

}

document.getElementById("estado").innerHTML =
"Pregunta " + (actual+1) + " de " + preguntas.length;

document.getElementById("pregunta").innerHTML =
preguntas[actual].texto;

for(let i=0;i<4;i++){

const boton =
document.getElementById("o"+(i+1));

boton.innerHTML =
preguntas[actual].opciones[i];

boton.onclick = function(){

responder(
preguntas[actual].opciones[i]
);

};

}

}

function responder(opcion){

if(terminado) return;

if(opcion === preguntas[actual].correcta){

document.getElementById("resultado").innerHTML =
"✅ Correcto";

puntos++;

}else{

document.getElementById("resultado").innerHTML =
"❌ Incorrecto";

}

document.getElementById("puntaje").innerHTML =
"🏆 Puntos: " + puntos;

actual++;

setTimeout(function(){

document.getElementById("resultado").innerHTML = "";
mostrarPregunta();

},700);

}

function finalizar(){

if(terminado) return;

terminado = true;

document.getElementById("opciones").style.display="none";

let medalla = "🥉 BRONCE";

if(puntos >= 3){
medalla = "🥈 PLATA";
}

if(puntos >= 5){
medalla = "🥇 ORO";
}

document.getElementById("estado").innerHTML =
"Actividad finalizada";

document.getElementById("pregunta").innerHTML =
`
<h2>${medalla}</h2>

<p>Obtuviste <strong>${puntos}</strong> de <strong>${preguntas.length}</strong> puntos.</p>

<p>📸 Toma una captura de pantalla y envíala en el chat de Teams.</p>
`;

}

let tiempo = 300;

function iniciarTemporizador(){

const intervalo = setInterval(function(){

if(terminado){

clearInterval(intervalo);
return;

}

tiempo--;

let min = Math.floor(tiempo/60);
let seg = tiempo%60;

document.getElementById("timer").innerHTML =
String(min).padStart(2,"0")
+ ":" +
String(seg).padStart(2,"0");

if(tiempo <= 0){

clearInterval(intervalo);
finalizar();

}

},1000);

}

</script>

</body>
</html>
